# BiFPN pose-only experiment with a YOLOv8-style single pose head.
# Reference official YOLO pose train_args inspected locally:
# task=pose, epochs=1000, batch=128, imgsz=640, optimizer=SGD,
# pretrained=False, lr0=0.01, lrf=0.01, momentum=0.937,
# weight_decay=0.0005, warmup_epochs=3.0, close_mosaic=20,
# box=7.5, cls=0.5, dfl=1.5, pose=12.0, kobj=1.0,
# mosaic=0.0, mixup=0.0, copy_paste=0.0, scale=0.9.

model: bifpn_pose
num_classes: 1
num_det_classes: 1
num_kpts: 17
reg_max: 16

neck:
  out_channels: 256
  use_p2_context: false
  downsample: conv

assigner:
  topk: 10
  alpha: 0.5
  beta: 6.0
  eps: 1.0e-9

pretrained:
  backbone:
    enabled: false
    weights: auto
    auto_download: true
    prefer_pose: true
    cache_dir: checkpoints/yolo
    strict: false
  modules:
    enabled: false
    weights: checkpoints/single_bifpn_det/bifpn_detect/bifpn_detect_best.pt
    include: [backbone, neck]
    exclude: []
    strict: false

data:
  root: /root/autodl-tmp/coco2017
  train_img: train2017
  train_label: labels/train2017
  val_img: val2017
  val_label: labels/val2017
  input_size: 640
  class_id_format: yolo80
  keep_classes: [0]
  person_only: true
  require_keypoints: true
  val_person_only: true
  val_require_keypoints: true

training:
  epochs: 1000
  batch_size: 32
  workers: 14

  optimizer: sgd
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  nesterov: true

  param_groups: yolo
  nbs: 64
  accumulate: auto
  scale_weight_decay: true

  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  yolo_warmup: true
  cos_lr: false

  grad_clip: 10.0
  ema_decay: 0.9999
  amp: true

  val_interval: 1
  save_interval: 50
  save_best_by: loss
  save_dir: checkpoints/single_bifpn_pose
  tensorboard: true
  log_interval: 50

  close_mosaic_epochs: 20
  no_mosaic: false

  early_stop:
    enabled: false
    patience: 50
    min_delta: 0.0
    start_epoch: 0

  dynamic_weights:
    enabled: false

  gradient_projection:
    enabled: false
    method: pcgrad
    eps: 1.0e-12

  freeze:
    enabled: false
    # From-scratch pose training: train backbone, neck, adapter, and pose head.
    trainable_modules: []
    freeze_modules: []
    freeze_bn: true

  staged_training:
    enabled: false
    stages: []

loss:
  w_box: 7.5
  w_cls: 0.5
  w_dfl: 1.5
  w_pose: 12.0
  w_kobj: 1.0

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.9
  shear: 0.0
  perspective: 0.0
  flip_lr: 0.5
  flip_ud: 0.0
  bgr: 0.0
  mosaic_prob: 0.0
  mixup_prob: 0.0
  cutmix_prob: 0.0
  copy_paste_prob: 0.0
  copy_paste_ioa: 0.3
  copy_paste_max_objects: 8

eval:
  score_thresh: 0.001
  iou_thresh: 0.7
  max_det: 300
  coco_max_det: 100
  batch_size: 16

validation:
  backend: cocoeval
  task: keypoints
  final_eval:
    enabled: true
    max_samples: 0
    det_metric: bbox/AP
    pose_metric: keypoints/AP

device: cuda
gpu_id: 0
debug: false
