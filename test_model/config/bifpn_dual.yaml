# Multi-Head Verification Training Config
# All training parameters can be adjusted here.
#
# Usage:
#   uv run python -m test_model.main --config test_model/config/bifpn_dual.yaml
#   uv run python -m test_model.main --config test_model/config/bifpn_dual.yaml --model bifpn_dual --epochs 500

# ---- Model ----
model: bifpn_dual
num_classes: 80         # total COCO classes (including person)
num_det_classes: 79     # detection head predicts COCO80 classes 1..79; pose head owns person class 0
num_kpts: 17            # COCO keypoints
reg_max: 16             # DFL max bin

neck:
  out_channels: 256
  use_p2_context: false
  downsample: conv

assigner:
  topk: 10
  alpha: 0.5
  beta: 6.0
  eps: 1.0e-9

# ---- Pretrained ----
pretrained:
  backbone:
    enabled: false
    weights: auto        # explicit path, filename, or auto to infer yolov8m* weights
    auto_download: false # from-scratch dual-head run: do not download/load weights
    prefer_pose: false    # prefer yolov8m-pose.pt before yolov8m.pt for backbone init
    cache_dir: checkpoints/yolo
    strict: false        # if true, require a near-complete backbone match
  modules:
    enabled: false
    weights: checkpoints/single_bifpn_det/bifpn_detect/bifpn_detect_best.pt
    include: [backbone, neck]
    exclude: []
    strict: false

# ---- Data ----
data:
  # AutoDL: /root/autodl-tmp/coco2017 (fast SSD)
  # Local:   /data/coco2017
  root: /root/autodl-tmp/coco2017
  train_img: train2017
  train_label: labels/train2017
  val_img: val2017
  val_label: labels/val2017
  input_size: 640
  class_id_format: yolo80   # yolo80 for standard COCO YOLO labels; coco/coco80 for category ids

# ---- Training ----
training:
  epochs: 500
  batch_size: 32            # 24GB GPU: start with 24; reduce to 16/12 if OOM
  workers: 14

  # Optimizer (SGD matches YOLOv8 official recipe)
  optimizer: sgd           # sgd | adamw
  lr0: 0.01                # YOLO-style base LR with nbs scaling/accumulation
  lrf: 0.01                # final LR = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005     # 5e-4
  nesterov: true
  param_groups: yolo
  nbs: 64
  accumulate: auto
  scale_weight_decay: true

  # Optional per-module LR groups. By default, non-backbone parameters use
  # lr0, while backbone parameters use lr0 * backbone_lr_mult. Set
  # backbone_lr to an absolute LR if you want it to override the multiplier.
  lr_groups:
    backbone_lr_mult: 1.0
    backbone_lr:

  # LR schedule
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  yolo_warmup: true
  cos_lr: true             # cosine annealing

  # Regularization
  grad_clip: 10.0          # max gradient norm (0 = disabled)
  ema_decay: 0.9999        # EMA decay (0 = disabled)

  # Mixed precision
  amp: true

  # Validation & checkpoint
  val_interval: 1          # validate every N epochs
  save_interval: 20        # save intermediate checkpoint every N epochs
  save_best_by: loss
  # Saved as checkpoints/<model_name>/ inside the project directory.
  save_dir: checkpoints/dual_scratch_dynamic

  # Logging
  tensorboard: true         # write TensorBoard logs to save_dir/tensorboard/
  log_interval: 50          # console log every N optimizer steps

  # Strong composite augmentations are disabled for the last N epochs.
  close_mosaic_epochs: 20
  no_mosaic: false         # completely disable mosaic

  # Resume controls. These options are only used when --resume is set.
  resume:
    # Keep the first resumed epoch at the checkpoint LR. This avoids the LR
    # jumping up when epochs is increased for continuation training.
    keep_current_lr: false
    lr_scale: 1.0

    # Compute validation loss on the resumed checkpoint and use it as the
    # initial best loss before further training. This prevents replacing the
    # best checkpoint with a worse resumed run just because best starts at inf.
    init_best_from_resume: false

    # Saved best checkpoints store EMA weights in model_state_dict. Resetting
    # EMA from the loaded model keeps resume validation aligned with the saved
    # best loss instead of swapping to an older raw EMA shadow.
    reset_ema_from_model: false

    # Disable mosaic for continuation from a late close-mosaic checkpoint.
    keep_mosaic_closed: false

  # Early stopping follows validation loss. COCOeval is run only after the
  # final training stage finishes.
  early_stop:
    enabled: false
    patience: 50
    min_delta: 0.002
    start_epoch: 100

  # Dynamic task weights at the task level.
  # Sub-loss weights stay in the loss section below.
  task_weights:
    det: 1.0
    pose: 1.0

  dynamic_weights:
    enabled: true
    method: dwa            # fixed | uncertainty | dwa

    # DWA (Dynamic Weight Average) uses the ratio of recent task losses:
    # r_i(t-1)=L_i(t-1)/L_i(t-2), w_i=2*softmax(r_i/temperature).
    # Larger temperature makes weights closer to 1:1. Use source=train unless
    # val_interval is 1 and you explicitly want validation-loss-driven weights.
    temperature: 2.0
    warmup_epochs: 2
    source: train          # train | val
    ratio_min: 0.0         # DWA ratio clamp for abnormal loss spikes
    ratio_max: 5.0

    # Bounds apply to DWA task weights and uncertainty effective weights.
    det_min: 0.2
    det_max: 5.0
    pose_min: 0.2
    pose_max: 5.0
    eps: 1.0e-8

  # Gradient projection for multi-task optimization.
  # When enabled, det and pose losses are backpropagated separately and
  # conflicting task gradients are projected before optimizer.step().
  # Recommended for joint stages only; keep off for single-task warmups.
  gradient_projection:
    enabled: false
    method: pcgrad
    eps: 1.0e-12

  freeze:
    enabled: false
    # Examples:
    #   trainable_modules: [det_adapter, det_head]
    #   trainable_modules: [pose_adapter, pose_head]
    #   freeze_modules: [backbone, neck]
    trainable_modules: []
    freeze_modules: []
    freeze_bn: true

  # Staged recipe when only the pretrained YOLOv8 backbone is reused.
  # 1) Freeze backbone and learn BiFPN/adapters/non-person detection head.
  # 2) Keep backbone frozen and learn the pose head on person+keypoint samples.
  # 3) Unfreeze backbone and jointly fine-tune non-person detection + person pose.
  staged_training:
    enabled: false
    stages: []

# ---- Loss Weights ----
loss:
  w_box: 7.5               # CIoU box loss
  w_cls: 0.5               # classification loss (Focal BCE)
  w_dfl: 1.5               # DFL distribution loss
  w_pose: 12.0             # keypoint OKS loss (person only)
  w_kobj: 1.0              # keypoint visibility loss

# ---- Augmentation ----
augmentation:
  hsv_h: 0.015             # hue
  hsv_s: 0.7               # saturation
  hsv_v: 0.4               # value
  translate: 0.1           # translation
  scale: 0.5               # scale
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  flip_lr: 0.5             # horizontal flip probability
  flip_ud: 0.0
  bgr: 0.0
  mosaic_prob: 1.0         # mosaic probability (0=never, 1=always)
  mixup_prob: 0.10
  cutmix_prob: 0.0
  copy_paste_prob: 0.0     # keep off for box/keypoint dual training
  copy_paste_ioa: 0.3
  copy_paste_max_objects: 8

# ---- Validation ----
validation:
  backend: cocoeval
  task: both
  final_eval:
    enabled: true
    max_samples: 0        # 0 = full validation set
    det_metric: bbox/AP
    pose_metric: keypoints/AP

# ---- Evaluation ----
eval:
  score_thresh: 0.01       # NMS score threshold
  iou_thresh: 0.6          # NMS IoU threshold
  max_det: 300             # max detections per image, aligned with YOLO/COCO eval
  batch_size: 16

# ---- Device ----
device: cuda               # cuda | cpu
gpu_id: 0                  # GPU index

# ---- Debug ----
debug: false               # quick smoke test (3 epochs, no val)






