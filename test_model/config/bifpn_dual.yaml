# Multi-Head Verification Training Config
# All training parameters can be adjusted here.
#
# Usage:
#   uv run python -m test_model.main --config test_model/config/bifpn_dual.yaml
#   uv run python -m test_model.main --config test_model/config/bifpn_dual.yaml --model bifpn_dual --epochs 100

# ---- Model ----
model: bifpn_dual
num_classes: 80         # total COCO classes (including person)
num_det_classes: 80     # detection head predicts all COCO classes, including person
num_kpts: 17            # COCO keypoints
reg_max: 16             # DFL max bin

# ---- Pretrained ----
pretrained:
  backbone:
    enabled: true
    weights: auto        # explicit path, filename, or auto to infer yolov8m* weights
    auto_download: true  # auto-download official YOLOv8 weights if not found locally
    prefer_pose: false    # prefer yolov8m-pose.pt before yolov8m.pt for backbone init
    cache_dir: checkpoints/yolo
    strict: false        # if true, require a near-complete backbone match

# ---- Data ----
data:
  # AutoDL: /root/autodl-tmp/coco2017 (fast SSD)
  # Local:   /data/coco2017
  root: /root/autodl-tmp/coco2017
  train_img: train2017
  train_label: labels/train2017
  val_img: val2017
  val_label: labels/val2017
  input_size: 640
  class_id_format: yolo80   # yolo80 for standard COCO YOLO labels; coco/coco80 for category ids

# ---- Training ----
training:
  epochs: 100
  batch_size: 32            # 24GB GPU: start with 24; reduce to 16/12 if OOM
  workers: 14

  # Optimizer (SGD matches YOLOv8 official recipe)
  optimizer: adamw           # sgd | adamw
  lr0: 0.005               # stable initial LR for dual-head training at batch 24
  lrf: 0.01                # final LR = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005     # 5e-4
  nesterov: true

  # Optional per-module LR groups. By default, non-backbone parameters use
  # lr0, while backbone parameters use lr0 * backbone_lr_mult. Set
  # backbone_lr to an absolute LR if you want it to override the multiplier.
  lr_groups:
    backbone_lr_mult: 0.1
    backbone_lr:

  # LR schedule
  warmup_epochs: 5
  cos_lr: true             # cosine annealing

  # Regularization
  grad_clip: 10.0          # max gradient norm (0 = disabled)
  ema_decay: 0.9999        # EMA decay (0 = disabled)

  # Mixed precision
  amp: true

  # Validation & checkpoint
  val_interval: 1          # validate every N epochs
  save_interval: 20        # save intermediate checkpoint every N epochs
  save_best_by: loss
  # Saved as checkpoints/<model_name>/ inside the project directory.
  save_dir: checkpoints/re

  # Logging
  tensorboard: true         # write TensorBoard logs to save_dir/tensorboard/
  log_interval: 50          # console log every N optimizer steps

  # Strong composite augmentations are disabled for the last N epochs.
  close_mosaic_epochs: 20
  no_mosaic: false         # completely disable mosaic

  # Early stopping follows validation loss. COCOeval is run only after the
  # final training stage finishes.
  early_stop:
    enabled: true
    patience: 10
    min_delta: 0.002
    start_epoch: 80

  # Dynamic task weights at the task level.
  # Sub-loss weights stay in the loss section below.
  dynamic_weights:
    enabled: false
    method: uncertainty    # uncertainty | dwa
    temperature: 2.0
    det_min: 0.2
    det_max: 5.0
    pose_min: 0.2
    pose_max: 5.0
    eps: 1.0e-8

  # Gradient projection for multi-task optimization.
  # When enabled, det and pose losses are backpropagated separately and
  # conflicting task gradients are projected before optimizer.step().
  # Recommended for joint stages only; keep off for single-task warmups.
  gradient_projection:
    enabled: false
    method: pcgrad
    eps: 1.0e-12

  # Staged recipe when only the pretrained YOLOv8 backbone is reused.
  # 1) Freeze backbone and learn the new BiFPN/adapters/detection head.
  # 2) Keep backbone frozen and add pose supervision with person-heavy batches.
  # 3) Unfreeze backbone and jointly fine-tune at a lower LR.
  staged_training:
    enabled: true
    stages:
      - name: frozen_det_warmup
        epochs: 30
        lr0: 0.003
        person_only: false
        train_det: true
        train_pose: false
        freeze_backbone: true
        det_weight: 1.0
        pose_weight: 0.0
        use_dynamic_weights: false
        use_gradient_projection: false
        load_best_for_next_stage: true
        close_mosaic_epochs: 0

      - name: frozen_pose_warmup
        epochs: 40
        lr0: 0.002
        person_only: true
        train_det: true
        train_pose: true
        freeze_backbone: true
        det_weight: 0.5
        pose_weight: 1.5
        use_dynamic_weights: false
        use_gradient_projection: false
        load_best_for_next_stage: true
        close_mosaic_epochs: 10

      - name: unfrozen_joint_tune
        epochs: 80
        lr0: 0.0005          # neck/head LR
        backbone_lr: 0.00005 # 0.1x lr0 for pretrained backbone fine-tuning
        person_only: false
        train_det: true
        train_pose: true
        freeze_backbone: false
        det_weight: 1.0
        pose_weight: 1.2
        use_dynamic_weights: false
        use_gradient_projection: false
        close_mosaic_epochs: 20

# ---- Loss Weights ----
loss:
  w_box: 7.5               # CIoU box loss
  w_cls: 0.5               # classification loss (Focal BCE)
  w_dfl: 1.5               # DFL distribution loss
  w_pose: 12.0             # keypoint OKS loss (person only)
  w_kobj: 1.0              # keypoint visibility loss

# ---- Augmentation ----
augmentation:
  hsv_h: 0.015             # hue
  hsv_s: 0.7               # saturation
  hsv_v: 0.4               # value
  translate: 0.1           # translation
  scale: 0.5               # scale
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  flip_lr: 0.5             # horizontal flip probability
  flip_ud: 0.0
  bgr: 0.0
  mosaic_prob: 0.3         # mosaic probability (0=never, 1=always)
  mixup_prob: 0.05
  cutmix_prob: 0.03
  copy_paste_prob: 0.03    # box crop copy-paste; keep low without masks
  copy_paste_ioa: 0.3
  copy_paste_max_objects: 8

# ---- Validation ----
validation:
  backend: cocoeval
  task: both
  final_eval:
    enabled: true
    max_samples: 0        # 0 = full validation set
    det_metric: bbox/AP
    pose_metric: keypoints/AP

# ---- Evaluation ----
eval:
  score_thresh: 0.01       # NMS score threshold
  iou_thresh: 0.6          # NMS IoU threshold
  max_det: 300             # max detections per image, aligned with YOLO/COCO eval
  batch_size: 16

# ---- Device ----
device: cuda               # cuda | cpu
gpu_id: 0                  # GPU index

# ---- Debug ----
debug: false               # quick smoke test (3 epochs, no val)






