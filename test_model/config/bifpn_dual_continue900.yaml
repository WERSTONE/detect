# Continue the DWA dual-head run from a late/best checkpoint without changing
# the effective LR or reopening mosaic.
#
# Usage:
#   python3 -u -m test_model.main \
#     --config test_model/config/bifpn_dual_continue900.yaml \
#     --resume checkpoints/dual_dwa/bifpn_dual/bifpn_dual_best.pt

model: bifpn_dual
num_classes: 80
num_det_classes: 79
num_kpts: 17
reg_max: 16

neck:
  out_channels: 256
  use_p2_context: false
  downsample: conv

assigner:
  topk: 10
  alpha: 0.5
  beta: 6.0
  eps: 1.0e-9

pretrained:
  backbone:
    enabled: false
    weights: auto
    auto_download: false
    prefer_pose: false
    cache_dir: checkpoints/yolo
    strict: false
  modules:
    enabled: false
    weights:
    include: []
    exclude: []
    strict: false

data:
  root: /root/autodl-tmp/coco2017
  train_img: train2017
  train_label: labels/train2017
  val_img: val2017
  val_label: labels/val2017
  input_size: 640
  class_id_format: yolo80

training:
  epochs: 900
  batch_size: 32
  workers: 14

  optimizer: sgd
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  nesterov: true
  param_groups: yolo
  nbs: 64
  accumulate: auto
  scale_weight_decay: true

  lr_groups:
    backbone_lr_mult: 1.0
    backbone_lr:

  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  yolo_warmup: true
  cos_lr: true

  grad_clip: 10.0
  ema_decay: 0.9999
  amp: true

  val_interval: 1
  save_interval: 20
  save_best_by: loss
  save_dir: checkpoints/dual_dwa

  tensorboard: true
  log_interval: 50

  # Keep late-stage fine-tuning data distribution unchanged after resume.
  close_mosaic_epochs: 0
  no_mosaic: true

  resume:
    keep_current_lr: true
    lr_scale: 1.0
    init_best_from_resume: true
    reset_ema_from_model: true
    keep_mosaic_closed: true

  early_stop:
    enabled: false
    patience: 50
    min_delta: 0.002
    start_epoch: 100

  # Base task multipliers. DWA still adjusts around these values.
  # Final task weights are roughly: det=1.5*dwa_det, pose=1.0*dwa_pose.
  task_weights:
    det: 1.5
    pose: 1.0

  dynamic_weights:
    enabled: true
    method: dwa
    temperature: 2.0
    warmup_epochs: 2
    source: train
    ratio_min: 0.0
    ratio_max: 5.0
    det_min: 0.2
    det_max: 5.0
    pose_min: 0.2
    pose_max: 5.0
    eps: 1.0e-8

  gradient_projection:
    enabled: false
    method: pcgrad
    eps: 1.0e-12

  freeze:
    enabled: false
    trainable_modules: []
    freeze_modules: []
    freeze_bn: true

  staged_training:
    enabled: false
    stages: []

loss:
  w_box: 7.5
  w_cls: 0.5
  w_dfl: 1.5
  w_pose: 12.0
  w_kobj: 1.0

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  flip_lr: 0.5
  flip_ud: 0.0
  bgr: 0.0
  mosaic_prob: 1.0
  mixup_prob: 0.10
  cutmix_prob: 0.0
  copy_paste_prob: 0.0
  copy_paste_ioa: 0.3
  copy_paste_max_objects: 8

validation:
  backend: cocoeval
  task: both
  final_eval:
    enabled: true
    max_samples: 0
    det_metric: bbox/AP
    pose_metric: keypoints/AP

eval:
  score_thresh: 0.01
  iou_thresh: 0.6
  max_det: 300
  batch_size: 16

device: cuda
gpu_id: 0

debug: false
