# Experiment 1: fine-tune a dual-head checkpoint with a frozen single-detect
# teacher. This isolates whether detect-only knowledge can improve dual detect
# AP while keeping pose close to its single-task baseline.
#
# Typical use:
#   python3 -u -m test_model.main \
#     --config test_model/config/bifpn_dual_experiment.yaml \
#     --init-weights checkpoints/dual_dwa/bifpn_dual/bifpn_dual_best.pt

model: bifpn_dual
num_classes: 80
num_det_classes: 79
num_kpts: 17
reg_max: 16

neck:
  out_channels: 256
  use_p2_context: false
  downsample: conv

assigner:
  topk: 10
  alpha: 0.5
  beta: 6.0
  eps: 1.0e-9

pretrained:
  backbone:
    enabled: false
    weights: auto
    auto_download: false
    prefer_pose: false
    cache_dir: checkpoints/yolo
    strict: false
  modules:
    enabled: false
    weights:
    include: []
    exclude: []
    strict: false

data:
  root: /root/autodl-tmp/coco2017
  train_img: train2017
  train_label: labels/train2017
  val_img: val2017
  val_label: labels/val2017
  input_size: 640
  class_id_format: yolo80

training:
  epochs: 50
  batch_size: 32
  workers: 16

  optimizer: sgd
  lr0: 0.0001
  lrf: 1.0
  momentum: 0.937
  weight_decay: 0.0005
  nesterov: true
  param_groups: yolo
  nbs: 64
  accumulate: auto
  scale_weight_decay: true

  # Fine-tuning from a late checkpoint with a fresh optimizer.
  warmup_epochs: 0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  yolo_warmup: false
  cos_lr: false

  grad_clip: 10.0
  ema_decay: 0.9999
  amp: true

  val_interval: 1
  save_interval: 10
  save_best_by: loss
  save_dir: checkpoints/dual_exp_det_distill

  tensorboard: true
  log_interval: 50

  close_mosaic_epochs: 0
  no_mosaic: true

  resume:
    keep_current_lr: false
    lr_scale: 1.0
    init_best_from_loaded: true
    init_score_best_from_loaded: true
    save_score_best_aliases: true
    reset_ema_from_model: false
    keep_mosaic_closed: false

  early_stop:
    enabled: false
    patience: 50
    min_delta: 0.0
    start_epoch: 0

  # Experiment knobs.
  task_weights:
    det: 1.5
    pose: 1.0

  dynamic_weights:
    enabled: false
    method: fixed
    temperature: 2.0
    warmup_epochs: 2
    source: train
    ratio_min: 0.0
    ratio_max: 5.0
    det_min: 0.2
    det_max: 5.0
    pose_min: 0.2
    pose_max: 5.0
    eps: 1.0e-8

  gradient_projection:
    enabled: false
    method: pcgrad       # pcgrad | gradnorm | cagrad
    scope: shared        # shared | all | comma-separated module roots
    eps: 1.0e-12
    gradnorm_alpha: 1.0
    cagrad_c: 0.5

  distillation:
    enabled: true
    teacher_model: bifpn_detect
    teacher_weights: checkpoints/bifpn_detect_best.pt
    teacher_num_classes: 80
    det:
      enabled: true
      cls_weight: 0.25
      dfl_weight: 0.25
      feature_weight: 0.0

  freeze:
    enabled: false
    trainable_modules: []
    freeze_modules: []
    freeze_bn: true

loss:
  w_box: 7.5
  w_cls: 0.5
  w_dfl: 1.5
  w_pose: 12.0
  w_kobj: 1.0

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  flip_lr: 0.5
  flip_ud: 0.0
  bgr: 0.0
  mosaic_prob: 1.0
  mixup_prob: 0.10
  cutmix_prob: 0.0
  copy_paste_prob: 0.0
  copy_paste_ioa: 0.3
  copy_paste_max_objects: 8

validation:
  backend: cocoeval
  task: both
  score_eval:
    enabled: true
    interval: 1
    max_samples: 0
    det_metric: bbox/AP
    pose_metric: keypoints/AP
    joint_metric: score
    det_baseline_mAP50_95: 0.5056917003412625
    pose_baseline_mAP50_95: 0.6503568561462488
  final_eval:
    enabled: true
    max_samples: 0
    det_metric: bbox/AP
    pose_metric: keypoints/AP

eval:
  score_thresh: 0.01
  iou_thresh: 0.6
  max_det: 300
  coco_max_det: 100
  batch_size: 16

device: cuda
gpu_id: 0
debug: false
