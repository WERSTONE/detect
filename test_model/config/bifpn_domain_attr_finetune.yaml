# Target-domain fine-tuning from the trained dual-head checkpoint.
#
# Effective training length is defined only by staged_training.stages:
#   new_heads 50 + det_adapter 50 + neck_guarded 60 + full_finetune 100 = 260 epochs
#
# Typical use:
#   python3 -u -m test_model.main \
#     --config test_model/config/bifpn_domain_attr_finetune.yaml

model: bifpn_dual_domain_attr
num_det_classes: 79
num_kpts: 17
reg_max: 16

domain_det:
  num_classes: 2
  names: [fire, water]
  # Prepared labels use class ids: person=0, fire=1, water=2.
  # The domain detection head is internal 0..1, so map fire 1->0 and water 2->1.
  class_map:
    1: 0
    2: 1

attributes:
  num_attrs: 4
  names: [smoking, falling, waving, helmet_on]

neck:
  out_channels: 256
  use_p2_context: false
  downsample: conv

assigner:
  topk: 10
  alpha: 0.5
  beta: 6.0
  eps: 1.0e-9

data:
  root: /root/detect/data/train_data
  train_img: images/train
  train_label: labels/train
  val_img: images/val
  val_label: labels/val
  input_size: 640
  class_id_format: yolo80

training:
  init_weights: checkpoints/dual_exp_det_distill/bifpn_dual/bifpn_dual_best.pt
  save_dir: checkpoints/domain_attr_finetune

  batch_size: 32
  workers: 16
  optimizer: sgd
  momentum: 0.937
  weight_decay: 0.0005
  nesterov: true
  param_groups: yolo
  nbs: 64
  accumulate: auto
  scale_weight_decay: true

  # Stage lr0/cos_lr/lrf values below are the effective learning-rate schedule.
  cos_lr: false
  lrf: 1.0
  yolo_warmup: false
  warmup_epochs: 0
  grad_clip: 10.0
  ema_decay: 0.9999
  amp: true

  val_interval: 1
  save_interval: 10
  save_best_by: loss
  tensorboard: true
  log_interval: 50

  # Before each stage trains, compute the current loaded checkpoint's val loss
  # and use it as that stage's initial best.
  loaded_checkpoint:
    init_best: true

  no_mosaic: true

  task_weights:
    det: 1.0
    attr: 10.0
    pose: 1.0

  staged_training:
    enabled: true
    start_stage: 1
    stages:
      - name: new_heads
        epochs: 50
        lr0: 0.003
        cos_lr: false
        lrf: 1.0
        train_domain_det: true
        train_attr: true
        train_pose: false
        det_weight: 1.0
        attr_weight: 10.0
        pose_weight: 0.0
        load_best_for_next_stage: true
        freeze:
          enabled: true
          trainable_modules: [domain_det_head, attr_head]
          freeze_bn: true

      - name: det_adapter
        epochs: 50
        lr0: 0.0003
        cos_lr: false
        lrf: 1.0
        train_domain_det: true
        train_attr: true
        train_pose: false
        det_weight: 1.0
        attr_weight: 10.0
        pose_weight: 0.0
        load_best_for_next_stage: true
        freeze:
          enabled: true
          trainable_modules: [det_adapter, domain_det_head, attr_head]
          freeze_bn: true

      - name: neck_guarded
        epochs: 60
        lr0: 0.0001
        cos_lr: false
        lrf: 1.0
        train_domain_det: true
        train_attr: true
        train_pose: true
        det_weight: 1.0
        attr_weight: 10.0
        pose_weight: 0.75
        load_best_for_next_stage: true
        freeze:
          enabled: true
          trainable_modules: [neck, det_adapter, domain_det_head, attr_head]
          freeze_bn: true

      - name: full_finetune
        epochs: 100
        lr0: 0.00003
        cos_lr: true
        lrf: 0.2
        train_domain_det: true
        train_attr: true
        train_pose: true
        det_weight: 1.0
        attr_weight: 10.0
        pose_weight: 1.0
        load_best_for_next_stage: false
        freeze:
          enabled: false

loss:
  w_box: 7.5
  w_cls: 0.5
  w_dfl: 1.5
  pose_det:
    enabled: true
    w_box: 7.5
    w_cls: 0.5
    w_dfl: 1.5
  w_attr: 1.0
  attr_pos_weight:
    smoking: 4.0
    falling: 2.0
    waving: 12.0
    helmet_on: 2.0
  w_pose: 12.0
  w_kobj: 1.0

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.3
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  flip_lr: 0.5
  flip_ud: 0.0
  bgr: 0.0

validation:
  backend: loss
  task: domain
  final_eval:
    enabled: true
    task: keypoints
    data_root: /root/autodl-tmp/coco2017
    val_img: val2017
    val_label: labels/val2017
    class_id_format: yolo80
    person_only: true
    require_keypoints: true
    max_samples: 0
    pose_metric: keypoints/AP

eval:
  score_thresh: 0.01
  iou_thresh: 0.6
  max_det: 300
  batch_size: 16

device: cuda
gpu_id: 0
debug: false
