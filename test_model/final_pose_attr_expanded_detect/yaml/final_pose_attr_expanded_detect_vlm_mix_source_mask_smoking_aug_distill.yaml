model: final_pose_attr
num_kpts: 17
reg_max: 16

domain_det:
  num_classes: 7
  names: [puddle, fire, smoke, other, helmet, head, cigarette]
  eval_class_ids: [1, 2, 3, 4, 5, 6, 7]
  class_map:
    1: 0
    2: 1
    3: 2
    4: 3
    5: 4
    6: 5
    7: 6

pose_attr:
  num_attrs: 4
  names: [smoking, falling, waving, helmet_on]
  attr_dropout: 0.05
  action_use_kpt_logits: true
  detach_kpt_context: true
  appearance_context_kernel: 5

neck:
  out_channels: 256
  use_p2_context: false
  downsample: conv

assigner:
  topk: 10
  alpha: 0.5
  beta: 6.0
  eps: 1.0e-9

data:
  input_size: 640
  split_policy:
    mode: fold_test
    test_train_ratio: 0.8
    seed: 20260817
  train:
    detect:
      sources:
        - root: /root/autodl-tmp/Detect
          images: train/images
          labels: train/labels
          test_images: test/images
          test_labels: test/labels
          class_offset: 1
          valid_class_ids: [1, 2, 3, 4, 7]
          split_salt: detect_domain
        - root: /root/autodl-tmp/Detect_head_helmet_cigarette
          images: train/images
          labels: train/labels
          test_images: test/images
          test_labels: test/labels
          class_offset: 5
          supervision_manifest: domain_supervision_manifest.jsonl
          split_salt: detect_head_helmet_cigarette
          group_augmentation:
            cigarette:
              mosaic_prob: 0.15
              zoom_out_prob: 0.65
              zoom_out_min_scale: 0.35
              zoom_out_max_scale: 1.0
              degrees: 5.0
              translate: 0.10
              scale: 0.50
    attr:
      root: /root/autodl-tmp/Attr
      split: train
      vlm_label_dirname: vlm_flashx_labels
      mix_vlm_non_main_attrs: true
      vlm_missing_policy: original
      domain_valid_class_ids: [1, 2, 3, 4, 7]
      domain_supervision_manifest: domain_supervision_manifest.jsonl
    pose:
      enabled: false
      root: /root/autodl-tmp/coco2017
      images: train2017
      labels: labels_person/train2017
      class_id_format: yolo80
      domain_valid_class_ids: [1, 2, 3, 4, 7]

  val:
    detect:
      sources:
        - root: /root/autodl-tmp/Detect
          images: valid/images
          labels: valid/labels
          test_images: test/images
          test_labels: test/labels
          class_offset: 1
          valid_class_ids: [1, 2, 3, 4, 7]
          split_salt: detect_domain
        - root: /root/autodl-tmp/Detect_head_helmet_cigarette
          images: valid/images
          labels: valid/labels
          test_images: test/images
          test_labels: test/labels
          class_offset: 5
          supervision_manifest: domain_supervision_manifest.jsonl
          split_salt: detect_head_helmet_cigarette
    attr:
      root: /root/autodl-tmp/Attr
      split: val
      vlm_label_dirname: vlm_flashx_labels
      mix_vlm_non_main_attrs: true
      vlm_missing_policy: original
      domain_valid_class_ids: [1, 2, 3, 4, 7]
      domain_supervision_manifest: domain_supervision_manifest.jsonl
    pose:
      enabled: true
      root: /root/autodl-tmp/coco2017
      images: val2017
      labels: labels_person/val2017
      class_id_format: yolo80
      domain_valid_class_ids: [1, 2, 3, 4, 7]

batch_sampling:
  mode: single_random_concat

training:
  init_weights: /root/detect/checkpoints/final_pose_attr_expanded_detect_vlm_mix_source_mask/adapter_alignment/final_pose_attr_adapter_alignment_best.pt
  skip_init_prefixes: [attr_head]
  save_dir: checkpoints/final_pose_attr_expanded_detect_vlm_mix_source_mask_smoking_aug_distill
  batch_size: 32
  workers: 16
  optimizer: sgd
  momentum: 0.937
  weight_decay: 0.0005
  nesterov: true
  param_groups: yolo
  nbs: 64
  accumulate: auto
  scale_weight_decay: true
  amp: true
  ema_decay: 0.9999
  grad_clip: 10.0
  log_interval: 50
  save_interval: 50
  val_interval: 1
  early_stop_enabled: true
  early_stop_patience: 20
  early_stop_min_delta: 0.0
  early_stop_start_epoch: 10
  tensorboard: true
  check_finite_loss: true

  gradient_projection:
    enabled: false
    method: pomsi
    scope: shared
    eps: 1.0e-12
    alpha: 1.0
    alpha_lr: 0.001
    alpha_min: 0.0
    alpha_max: 5.0
    static: false

  distillation:
    enabled: true
    teacher_weights: /root/detect/checkpoints/final_pose_attr_expanded_detect_vlm_mix_source_mask/adapter_alignment/final_pose_attr_adapter_alignment_best.pt
    pose:
      enabled: true
      confidence_threshold: 0.35
      cls_weight: 0.03
      box_weight: 0.08
      kpt_weight: 0.08
      kpt_obj_weight: 0.02

  stages:
    - name: new_attr_branches
      epochs: 60
      lr0: 0.003
      warmup_epochs: 3
      cos_lr: true
      lrf: 0.1
      val_interval: 10
      train_detect: true
      train_attr: true
      train_pose: false
      det_weight: 1.0
      attr_weight: 3.0
      pose_weight: 0.0
      attr_person_box_weight: 0.0
      early_stop_enabled: false
      load_best_for_next_stage: true
      freeze:
        enabled: true
        trainable_modules:
          - domain_det_head
          - pose_head.appearance_branches
          - pose_head.action_branches
      use_gradient_projection: false
      distillation:
        enabled: false

    - name: adapter_alignment
      epochs: 30
      lr0: 0.0006
      warmup_epochs: 2
      cos_lr: true
      lrf: 0.1
      val_interval: 10
      train_detect: true
      train_attr: true
      train_pose: true
      det_weight: 1.0
      attr_weight: 6.0
      pose_weight: 1.0
      attr_person_box_weight: 0.5
      early_stop_enabled: false
      load_best_for_next_stage: true
      freeze:
        enabled: true
        trainable_modules:
          - det_adapter
          - pose_adapter
          - domain_det_head
          - pose_head.appearance_branches
          - pose_head.action_branches
      use_gradient_projection: false
      distillation:
        enabled: false

    - name: neck_guarded
      epochs: 150
      lr0: 0.00015
      warmup_epochs: 1
      cos_lr: true
      lrf: 0.3
      val_interval: 1
      train_detect: true
      train_attr: true
      train_pose: true
      det_weight: 1.0
      attr_weight: 10.0
      pose_weight: 1.0
      attr_person_box_weight: 0.5
      close_mosaic_epochs: 15
      early_stop_patience: 10
      early_stop_start_epoch: 10
      load_best_for_next_stage: true
      freeze:
        enabled: true
        trainable_modules:
          - neck
          - det_adapter
          - pose_adapter
          - domain_det_head
          - pose_head.appearance_branches
          - pose_head.action_branches
      use_gradient_projection: false
      distillation:
        enabled: true
        pose:
          enabled: true
          confidence_threshold: 0.35
          cls_weight: 0.03
          box_weight: 0.08
          kpt_weight: 0.08
          kpt_obj_weight: 0.02

    - name: guarded_backbone
      epochs: 50
      lr0: 0.00002
      warmup_epochs: 1
      cos_lr: true
      lrf: 0.2
      val_interval: 1
      train_detect: true
      train_attr: true
      train_pose: true
      det_weight: 1.0
      attr_weight: 5.0
      pose_weight: 1.0
      attr_person_box_weight: 0.25
      close_mosaic_epochs: 10
      early_stop_patience: 10
      early_stop_start_epoch: 5
      load_best_for_next_stage: false
      freeze:
        enabled: false
      use_gradient_projection: false
      distillation:
        enabled: true
        pose:
          enabled: true
          confidence_threshold: 0.35
          cls_weight: 0.03
          box_weight: 0.08
          kpt_weight: 0.08
          kpt_obj_weight: 0.02

loss:
  w_attr: 1.0
  attr_consistency_weight: 0.01
  domain_class_weights:
    puddle: 1.0
    fire: 1.0
    smoke: 1.0
    other: 1.0
    helmet: 1.0
    head: 1.0
    cigarette: 2.0
  person_box_source_weights:
    pose: 1.0
    attr: 0.5
  attr_pos_weight:
    smoking: 2.5
    falling: 1.0
    waving: 1.5
    helmet_on: 2.0

eval:
  enabled: true
  batch_size: 16
  score_thresh: 0.01
  domain_conf: 0.25
  person_conf: 0.25
  attr_thresh: 0.5
  iou_thresh: 0.6
  match_iou: 0.5
  max_det: 300
  output_dir: checkpoints/final_pose_attr_expanded_detect_vlm_mix_source_mask_smoking_aug_distill/eval
  coco_pose: true

augmentation:
  detect:
    augment: true
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 5.0
    translate: 0.10
    scale: 0.50
    flip_lr: 0.5
    require_full_boxes: false
    affine_retries: 8
    zoom_out_prob: 0.0
    zoom_out_min_scale: 1.0
    zoom_out_max_scale: 1.0
    mosaic_prob: 0.30
  attr:
    augment: true
    hsv_h: 0.01
    hsv_s: 0.45
    hsv_v: 0.3
    degrees: 5.0
    translate: 0.04
    scale: 0.10
    flip_lr: 0.5
    require_full_boxes: true
    affine_retries: 20
    zoom_out_prob: 0.0
    zoom_out_min_scale: 1.0
    zoom_out_max_scale: 1.0
    mosaic_prob: 0.0
  pose:
    augment: true
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.3
    degrees: 3.0
    translate: 0.06
    scale: 0.20
    flip_lr: 0.5
    require_full_boxes: false
    affine_retries: 8
    zoom_out_prob: 0.0
    zoom_out_min_scale: 1.0
    zoom_out_max_scale: 1.0
    mosaic_prob: 0.0

device: cuda
